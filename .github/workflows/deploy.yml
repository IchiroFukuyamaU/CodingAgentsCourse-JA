name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # GitHub Pages hostnames are lowercase, so the owner is lowercased here
      # (e.g. UiPathPartnersJPN -> uipathpartnersjpn). The repository name keeps
      # its original casing, because the path segment is case-sensitive.
      - name: Resolve the Pages URL
        id: pages
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "site_url=https://${owner}.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"

      - name: Build & deploy (production environment)
        env:
          COURSE_ENV: prod
          SITE_URL: ${{ steps.pages.outputs.site_url }}
        run: mkdocs gh-deploy --force
